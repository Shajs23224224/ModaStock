name: Backend CI
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - "feature/fase-5-seguridad-autenticacion"
      - "feature/fase-7-modulos-inventario"
      - "feature/fase-8-integracion-tecnologica"
      - "feature/fase-9-pruebas-aseguramiento-calidad"
      - "feature/fase-10-despliegue-documentacion"
      - "main"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: modastock_test
          POSTGRES_USER: modastock
          POSTGRES_PASSWORD: modastock_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modastock -d modastock_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://modastock:modastock_test_password@localhost:5432/modastock_test
      APP_ENV: test
      JWT_SECRET_KEY: test-only-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests (SQLite unit tests + PostgreSQL integration)
        run: pytest
