name: Frontend CI
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - "feature/fase-6-frontend-interfaz"
      - "feature/fase-7-modulos-inventario"
      - "feature/fase-9-pruebas-aseguramiento-calidad"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Run frontend unit tests
        run: npm run test -- --run
      - name: Type-check and build
        run: npm run build
