[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"
[project]
name="modastock-api"
version="0.2.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","SQLAlchemy>=2,<3","psycopg[binary]>=3.2,<4","pydantic-settings>=2.5,<3","alembic>=1.13,<2","pwdlib[argon2]>=0.2,<1","PyJWT>=2.9,<3","email-validator>=2.2,<3"]
[project.optional-dependencies]
test=["pytest>=8,<9","httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
addopts="-q"
[tool.hatch.build.targets.wheel]
packages=["app"]
